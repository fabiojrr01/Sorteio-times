<style>

</style></head><body><main>
<h1>⚽ Sorteio de Times</h1>

<script>
window.addEventListener("unhandledrejection",e=>{msg="Erro inesperado: "+((e.reason&&e.reason.message)||e.reason);try{render()}catch(x){}});

/* Configuração do Firebase: o criador do app preenche aqui (veja o passo a passo). Sem ela, o app funciona em modo local. */
const FIREBASE_CONFIG=window.__fakeFB?{fake:1}:{
  "apiKey": "AIzaSyBB9-sGSGnILbXAUvh_9o6KsWOA3nt1WAw",
  "authDomain": "sorteio-times-login.firebaseapp.com",
  "projectId": "sorteio-times-login",
  "storageBucket": "sorteio-times-login.firebasestorage.app",
  "messagingSenderId": "423753117732",
  "appId": "1:423753117732:web:64a5232430372616e3a8b1"
};
const DONO=window.__fakeFB?(window.__fakeDONO||""):"fabiojuniorfv1@gmail.com";
const TIPOS={misto:["50+","40+"],so50:["50+"],so40:["40+"],livre:[]};
const TNOMES={misto:"50+ e 40+ (50+ tem prioridade)",so50:"Só 50+",so40:"Só 40+",livre:"Livre (sem regra de idade)"};
const MODELOS={Futebol:[["Goleiro",1,1],["Defesa",0,0],["Meio",0,0],["Ataque",0,0]],"Vôlei":[["Levantador",0,0],["Ponta",0,0],["Oposto",0,0],["Central",0,0],["Líbero",1,0]],Basquete:[["Armador",0,0],["Ala",0,0],["Pivô",0,0]]};
const mk=a=>a.map(([n,max,ex])=>({n,max,ex:!!ex}));
const COLORS=["#f4a259","#6cb8f0","#f2d64e","#f08bb4","#8fd694","#b79af0","#f08a7a","#7fd6d0"];
const $=s=>document.querySelector(s);
let FB=null,USER=null,ROLE="",OWNER=false,fbErr=false,acesso=[],unsub=[],peladas=[],pid="",listOk=false,undados=[],bkpTxt="",bkpMsg="",ADM=false,synced=false,cfg={tipo:"misto",pos:mk(MODELOS.Futebol)},players=[],present=new Set(),guests=[],tab="j",editId=null,qt={times:2,jog:5},result=null,err="",arr={},seqC=0,subIn="",subOut=new Set(),sug=null,note="",flt="todos",msg="",draft=null,pend=null,okMsg="",delAsk=null,askNew=false;
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const groups=()=>TIPOS[cfg.tipo]||[];
const lastG=()=>{const g=groups();return g[g.length-1]||""};
const P=n=>cfg.pos.find(p=>p.n===n)||{max:0,ex:false};
const exN=n=>P(n).ex,maxP=n=>P(n).max;
const noAge=x=>exN(x.pos)||!groups().length;
const pr=x=>noAge(x)?0:Math.max(0,groups().indexOf(x.grp||lastG()));
const gl=x=>noAge(x)?"":" · "+(x.grp||lastG());
const cmp=(a,b)=>pr(a)-pr(b)||(arr[a.id]||0)-(arr[b.id]||0);
const posOpts=s=>cfg.pos.map(p=>`<option ${p.n==s?"selected":""}>${esc(p.n)}</option>`).join("");
const grpOpts=s=>groups().map(g=>`<option ${g==(s||lastG())?"selected":""}>${g}</option>`).join("");
const lvlOpts=s=>[1,2,3,4,5].map(n=>`<option value="${n}" ${n==s?"selected":""}>Nível ${n}</option>`).join("");
const defPos=()=>(cfg.pos[1]||cfg.pos[0]||{n:""}).n;
const ixP=n=>{const i=cfg.pos.findIndex(p=>p.n===n);return i<0?99:i};
const exLabel=()=>cfg.pos.some(p=>p.ex&&p.n==="Goleiro")?"GK":"Sem idade";
let wq=Promise.resolve(),wn=0;
const cl=o=>JSON.parse(JSON.stringify(o));
function persist(w){
  if(!FIREBASE_CONFIG){LS(w==="c"?"config":"jogadores",w==="c"?cfg:players);return Promise.resolve()}
  wn++;
  wq=wq.then(async()=>{try{
    if(w==="c")await FB.save("peladas/"+pid+"/dados/config",cl(cfg));
    else if(w==="a"){const q=cl(pel());delete q.id;await FB.save("peladas/"+pid,q)}
    else await FB.save("peladas/"+pid+"/dados/players",{list:cl(players)})
  }catch(e){err="Não foi possível salvar. Verifique seu acesso."}finally{wn--}});
  return wq;
}
async function fbInit(){
  if(window.__fakeFB)return window.__fakeFB;
  const B="https://www.gstatic.com/firebasejs/10.14.1/";
  const [a,au,fs]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
  const app=a.initializeApp(FIREBASE_CONFIG),auth=au.getAuth(app),db=fs.getFirestore(app);
  return{
    onUser:cb=>au.onAuthStateChanged(auth,u=>cb(u?{email:(u.email||"").toLowerCase(),name:u.displayName||""}:null)),
    login:()=>au.signInWithPopup(auth,new au.GoogleAuthProvider()),
    logout:()=>au.signOut(auth),
    watch:(p,ok,fail)=>fs.onSnapshot(fs.doc(db,p),s=>ok(s.exists()?s.data():null),e=>fail(e)),
    watchList:(email,todos,ok,fail)=>{const c=fs.collection(db,"peladas");const q=todos?c:fs.query(c,fs.where("membros","array-contains",email));return fs.onSnapshot(q,s=>ok(s.docs.map(d=>({id:d.id,...d.data()}))),e=>fail(e))},
    save:(p,d)=>fs.setDoc(fs.doc(db,p),d)
  };
}
function startLocal(){const c=LS("config");if(c&&c.pos)cfg=c;players=LS("jogadores")||[];ADM=OWNER=true;synced=true;render()}
const isDono=()=>!!USER&&USER.email===DONO;
const pel=()=>peladas.find(p=>p.id===pid)||null;
const rolDe=p=>{if(!USER)return "";if(isDono())return "admin";const e=USER.email;return (p.admins||[]).includes(e)?"admin":(p.editores||[]).includes(e)?"editor":(p.viewers||[]).includes(e)?"viewer":""};
const rolNome=r=>({admin:"Administrador",editor:"Editor",viewer:"Visualizador"}[r]||"");
function setPerms(){if(!FIREBASE_CONFIG)return;const p=pel(),r=p?rolDe(p):"";ADM=r==="admin"||r==="editor";OWNER=r==="admin"}
function subs(){
  unsub.forEach(u=>{try{u()}catch(e){}});unsub=[];undados.forEach(u=>{try{u()}catch(e){}});undados=[];
  peladas=[];pid="";listOk=false;synced=false;ADM=OWNER=false;players=[];
  if(!USER)return;
  unsub.push(FB.watchList(USER.email,isDono(),l=>{
    peladas=cl(l).sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));listOk=true;
    if(pid&&!pel()){pid="";subDados()}
    if(!pid){const ult=LS("ultimaPelada");if(peladas.length===1)pid=peladas[0].id;else if(ult&&peladas.some(p=>p.id===ult))pid=ult;if(pid)subDados()}
    setPerms();render();
  },()=>{listOk=true;render()}));
}
function subDados(){
  undados.forEach(u=>{try{u()}catch(e){}});undados=[];
  players=[];synced=false;present=new Set();guests=[];arr={};seqC=0;result=null;sug=null;subOut=new Set();subIn="";tab="j";
  cfg={tipo:"misto",pos:mk(MODELOS.Futebol)};
  if(pid){LS("ultimaPelada",pid);
    undados.push(FB.watch("peladas/"+pid+"/dados/players",d=>{if(!wn)players=cl((d&&d.list)||[]);synced=true;msg="";render()},()=>{synced=true;render()}));
    undados.push(FB.watch("peladas/"+pid+"/dados/config",d=>{if(d&&!wn)cfg=Object.assign({tipo:"misto",pos:cfg.pos},cl(d));render()},()=>{}));
  }
  setPerms();
}
function escolher(id){pid=id;subDados();render()}
function trocar(){pid="";LS("ultimaPelada","");subDados();render()}
async function novaPelada(){
  const nome=$("#np2").value.trim();
  if(!nome){err="Digite o nome da pelada.";return render()}
  const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{
    await FB.save("peladas/"+id,{nome,admins:[],editores:[],viewers:[],membros:[]});
    await FB.save("peladas/"+id+"/dados/config",{tipo:"misto",pos:cl(mk(MODELOS.Futebol))});
    await FB.save("peladas/"+id+"/dados/players",{list:[]});
  }catch(e){err="Não foi possível criar a pelada.";return render()}
  err="";escolher(id);
}
async function boot(){
  if(!FIREBASE_CONFIG){startLocal();return}
  render();
  try{FB=await fbInit()}catch(e){fbErr=true;render();return}
  FB.onUser(u=>{USER=u;err="";subs();render()});
}
async function fbLogin(){try{await FB.login()}catch(e){err="Não foi possível entrar: "+(e.code||e.message);render()}}
function fbLogout(){FB.logout()}
function telaPeladas(){
  return `<section class="card"><h2>Minhas peladas</h2>
  ${peladas.map(p=>`<button class="btn ghost" style="margin:0 0 8px;text-align:left" onclick="escolher('${p.id}')"><b>${esc(p.nome||"Pelada")}</b><br><span class="mut" style="font-weight:500">${isDono()?"Criador":rolNome(rolDe(p))}</span></button>`).join("")||`<p class="mut">Nenhuma pelada ainda.</p>`}
  ${isDono()?`<h2 style="margin-top:14px">Nova pelada</h2><input id="np2" placeholder="Nome da pelada" maxlength="40"><button class="btn" onclick="novaPelada()">Criar pelada</button>${err?`<p class="msg">${esc(err)}</p>`:""}`:""}
  <p class="mut" style="font-size:13px;margin:12px 0 0">${esc(USER.email)} · <a href="#" onclick="fbLogout();return false" style="color:inherit">Sair</a></p></section>`;
}
function gate(){
  if(!FIREBASE_CONFIG)return "";
  if(fbErr)return `<section class="card"><h2>Sem conexão</h2><p class="mut">Não foi possível carregar o serviço de acesso. Verifique a internet.</p><button class="btn" onclick="location.reload()">Tentar de novo</button></section>`;
  if(!FB)return `<p class="mut">Carregando...</p>`;
  if(!USER)return `<section class="card"><h2>Entrar</h2><p class="mut">Este app é de acesso restrito. Entre com a conta Google que o administrador da sua pelada liberou.</p><button class="btn" onclick="fbLogin()">Entrar com Google</button>${err?`<p class="msg">${esc(err)}</p>`:""}</section>`;
  if(!listOk)return `<p class="mut">Carregando suas peladas...</p>`;
  if(!peladas.length&&!isDono())return `<section class="card"><h2>Sem acesso</h2><p class="mut">O e-mail ${esc(USER.email)} ainda não está em nenhuma pelada. Envie esse e-mail ao administrador da sua pelada.</p><button class="btn ghost" onclick="fbLogout()">Sair e usar outra conta</button></section>`;
  if(!pid)return telaPeladas();
  return "";
}
function secAcesso(){
  const p=pel();
  if(!FIREBASE_CONFIG||!OWNER||!p)return "";
  const L=[...(p.admins||[]).map(e=>[e,"Administrador"]),...(p.editores||[]).map(e=>[e,"Editor"]),...(p.viewers||[]).map(e=>[e,"Visualizador"])];
  return `<section class="card"><h2>Pessoas desta pelada</h2>
  <label class="mut" for="nmp">Nome da pelada</label><input id="nmp" maxlength="40" value="${esc(p.nome||"")}" onchange="renPelada(this.value)">
  <p class="mut" style="margin:0 0 6px;font-size:13px">Administrador: configura a pelada e libera pessoas. Editor: cadastra jogadores e sorteia. Visualizador: vê o cadastro e sorteia.</p>
  ${L.map(([e,r])=>`<div class="item"><span>${esc(e)}<small>${r}</small></span><button class="ico" onclick="delAcesso('${esc(e)}')" aria-label="Remover acesso">🗑</button></div>`).join("")||`<p class="mut">Ninguém ainda.</p>`}
  <input id="ne" type="email" placeholder="E-mail Google da pessoa" style="margin-top:10px">
  <select id="nr"><option value="admins">Administrador</option><option value="editores" selected>Editor</option><option value="viewers">Visualizador</option></select>
  <button class="btn" onclick="addAcesso()">Dar acesso</button>${err?`<p class="msg">${esc(err)}</p>`:""}</section>`;
}
async function addAcesso(){
  const e=$("#ne").value.trim().toLowerCase(),r=$("#nr").value,p=pel();
  if(!p)return;
  if(!/^[^@\s'"<>]+@[^@\s'"<>]+\.[^@\s'"<>]+$/.test(e)){err="Digite um e-mail válido.";return render()}
  if((p.membros||[]).includes(e)){err="Esse e-mail já está nesta pelada.";return render()}
  p[r]=[...(p[r]||[]),e];p.membros=[...(p.membros||[]),e];err="";await persist("a");render();
}
async function delAcesso(e){const p=pel();if(!p)return;["admins","editores","viewers","membros"].forEach(k=>{p[k]=(p[k]||[]).filter(x=>x!==e)});err="";await persist("a");render()}
async function renPelada(v){const p=pel();v=v.trim();if(!p||!v)return;p.nome=v.slice(0,40);await persist("a");render()}
const bkp=()=>ADM?`<section class="card"><h2>Backup da lista</h2><p class="mut" style="margin:0 0 8px;font-size:13px">Copie a lista para guardar ou levar a outro aparelho. Para importar, cole aqui o texto copiado. Jogadores que já existem (mesmo nome e posição) não são repetidos.</p>
  <button class="btn ghost" style="margin-top:0" onclick="expor()">Copiar lista de jogadores</button>
  <textarea id="bk" rows="4" placeholder="Cole aqui o texto da lista para importar" style="width:100%;margin:8px 0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:13px monospace">${esc(bkpTxt)}</textarea>
  ${OWNER?`<label style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="checkbox" id="bkc" checked> Aplicar também o tipo da pelada e as posições</label>`:""}
  <button class="btn" onclick="impor()">Importar lista</button>${bkpMsg?`<p class="ok">${esc(bkpMsg)}</p>`:""}</section>`:"";
function expor(){
  const t=JSON.stringify({v:1,c:{tipo:cfg.tipo,pos:cfg.pos},p:players.map(p=>[p.name,p.pos,p.lvl,p.grp||""])});
  bkpTxt=t;bkpMsg="Texto da lista gerado abaixo.";
  const done=m=>{bkpMsg=m;render()};
  try{navigator.clipboard.writeText(t).then(()=>done("Lista copiada. Cole em uma mensagem ou nota para guardar."),()=>done("Copie o texto abaixo manualmente."))}catch(e){done("Copie o texto abaixo manualmente.")}
}
async function impor(){
  let d;try{d=JSON.parse($("#bk").value.trim())}catch(e){d=null}
  if(!d||!Array.isArray(d.p)){bkpMsg="Texto inválido. Cole a lista exatamente como foi copiada.";return render()}
  const ex=new Set(players.map(p=>norm(p.name)+"|"+p.pos)),novos=[];let ja=0;
  d.p.forEach(x=>{if(!Array.isArray(x)||!x[0])return;const k=norm(x[0])+"|"+x[1];if(ex.has(k)){ja++;return}ex.add(k);novos.push({id:uid(),name:String(x[0]).slice(0,30),pos:String(x[1]),lvl:Math.min(5,Math.max(1,+x[2]||3)),grp:x[3]||""})});
  let extra="";
  if(OWNER&&d.c&&Array.isArray(d.c.pos)&&TIPOS[d.c.tipo]&&$("#bkc")&&$("#bkc").checked){cfg.tipo=d.c.tipo;cfg.pos=d.c.pos.map(p=>({n:String(p.n),max:+p.max||0,ex:!!p.ex}));await persist("c");extra=" Tipo e posições aplicados."}
  players=players.concat(novos);bkpMsg=novos.length+" jogador(es) importado(s), "+ja+" já existia(m)."+extra;bkpTxt="";
  await persist("p");render();
}
function go(t){tab=t;err="";msg="";okMsg="";askNew=false;pend=null;draft=null;delAsk=null;render()}
function render(){
  if(tab==="a"&&!OWNER)tab="j";
  const g=gate(),v={j:viewJ,s:viewS,t:viewT,a:viewA}[tab];
  const pp=pel(),who=FIREBASE_CONFIG&&USER&&!g?`<p class="mut" style="margin:0 0 10px;font-size:13px">${esc(USER.email)} · ${isDono()?"criador":rolNome(pp?rolDe(pp):"")} · <b>${esc(pp?pp.nome:"")}</b> · <a href="#" onclick="trocar();return false" style="color:inherit">Trocar pelada</a> · <a href="#" onclick="fbLogout();return false" style="color:inherit">Sair</a></p>`:"";
  $("#app").innerHTML=g||((msg?`<p class="msg">${msg}</p>`:"")+who+v());
  document.querySelector(".tabs").style.display=g?"none":"";
  const ta=document.querySelector('.tab[data-t="a"]');if(ta)ta.style.display=OWNER?"":"none";
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
}
function togG(sel,pos){const e=$(sel);if(e)e.style.display=(exN(pos)||!groups().length)?"none":""}
function viewJ(){
  const e=(editId&&players.find(p=>p.id===editId))||draft||{name:"",pos:defPos(),lvl:3};
  const sorted=[...players].sort((a,b)=>a.name.localeCompare(b.name));
  const names=[...cfg.pos.map(p=>p.n),...new Set(players.map(p=>p.pos).filter(n=>!cfg.pos.some(c=>c.n===n)))];
  const imp=ADM&&FB&&!players.length&&(LS("jogadores")||[]).length;
  const form=ADM?`<section class="card"><h2>${editId?"Editar jogador":"Novo jogador"}</h2>
  <input id="nm" placeholder="Nome" maxlength="30" value="${esc(e.name)}">

  ${groups().length?`<select id="gr" style="${noAge(e)?"display:none":""}">${grpOpts(e.grp)}</select>`:""}
  <p class="mut" style="margin:0 0 8px;font-size:13px">Nível 1 = pouca habilidade, nível 5 = muita habilidade.</p>
  ${pend?`<div class="msg" style="margin:0 0 10px">Já existe ${esc(pend.dup.name)} (${esc(pend.dup.pos)}, nível ${pend.dup.lvl}${gl(pend.dup)}) ${pend.same?"com o mesmo cadastro":"com dados diferentes"}. Deseja cadastrar mesmo assim como ${esc(pend.nome)}?</div><button class="btn" onclick="dupSim()">Sim, cadastrar como ${esc(pend.nome)}</button><button class="btn ghost" onclick="pend=null;render()">Não, voltar</button>`:`<button class="btn" onclick="salvarJ()">${editId?"Salvar alterações":"Adicionar jogador"}</button>`}
  ${editId?`<button class="btn ghost" onclick="editId=null;render()">Cancelar</button>`:""}
  ${err?`<p class="msg">${err}</p>`:""}${okMsg?`<p class="ok" style="color:#1f9d55">${esc(okMsg)}</p>`:""}</section>`:`<section class="card"><p class="mut">Seu acesso é só para ver os jogadores e sortear.</p></section>`;
  return form+`<section class="card"><h2>Jogadores cadastrados (${players.length})</h2>
  ${imp?`<button class="btn ghost" onclick="importar()">Importar ${LS("jogadores").length} jogadores deste aparelho</button>`:""}
  ${sorted.length?names.map(pos=>{const g=sorted.filter(p=>p.pos===pos);return g.length?`<h3 class="gh">${esc(pos)} (${g.length})</h3>`+g.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><small>Nível ${p.lvl}${gl(p)}</small></div>${ADM?(delAsk===p.id?`<div><button class="ico" style="font-size:14px;font-weight:800;color:var(--dg)" onclick="delJ('${p.id}')">Sim, excluir</button><button class="ico" style="font-size:14px" onclick="delAsk=null;render()">Não</button></div>`:`<div><button class="ico" onclick="editJ('${p.id}')" aria-label="Editar">✎</button><button class="ico" onclick="delAsk='${p.id}';render()" aria-label="Excluir">🗑</button></div>`):""}</div>`).join(""):""}).join(""):`<p class="mut">${synced?"Nenhum jogador ainda.":"Carregando..."}</p>`}</section>`+bkp();
}
async function salvarJ(ovr){
  const name=$("#nm").value.trim();
  if(!name){err="Digite o nome do jogador.";return render()}
  const pos=$("#ps").value,d={name,pos,lvl:+$("#lv").value,grp:(exN(pos)||!groups().length)?"":$("#gr").value};
  if(editId){Object.assign(players.find(p=>p.id===editId),d);editId=null;okMsg=name+" atualizado."}else{const dup=players.find(p=>norm(p.name)===norm(name));if(dup&&!ovr){draft=d;pend={dup,same:dup.pos===d.pos&&dup.lvl===d.lvl&&(dup.grp||"")===(d.grp||""),nome:nextName(name)};err="";return render()}const fn=ovr?nextName(name):name;players.push({id:uid(),...d,name:fn});okMsg=fn+" cadastrado.";draft=null;pend=null}
  err="";await persist("p");render();
}
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const nextName=b=>{let i=1;while(players.some(p=>norm(p.name)===norm(b+i)))i++;return b+i};
function dupSim(){salvarJ(true)}
function editJ(id){editId=id;err="";draft=null;pend=null;okMsg="";render();window.scrollTo({top:0,behavior:"smooth"})}
async function delJ(id){const n=(players.find(p=>p.id===id)||{}).name;delAsk=null;okMsg=n?n+" foi excluído.":"";players=players.filter(p=>p.id!==id);present.delete(id);delete arr[id];await persist("p");render()}
async function importar(){players=LS("jogadores")||[];await persist("p");render()}
const visP=()=>players.filter(p=>flt==="todos"||(flt==="EX"?exN(p.pos):!exN(p.pos)&&(p.grp||lastG())===flt)).sort((a,b)=>a.name.localeCompare(b.name));
function viewS(){
  if(flt!=="todos"&&flt!=="EX"&&!groups().includes(flt))flt="todos";
  const fl=[["todos","Todos"],...groups().map(g=>[g,g]),...(cfg.pos.some(p=>p.ex)?[["EX",exLabel()]]:[])];
  return `<section class="card"><h2>Quem veio hoje? <span class="mut" id="cnt"></span></h2>
  <div class="bar">${fl.map(([f,l])=>`<button class="${flt===f?"fon":""}" onclick="flt='${f}';render()">${l}</button>`).join("")}</div>
  ${cfg.pos.some(p=>p.ex)?`<p class="mut" style="margin:0;font-size:13px">Posições sem regra de idade aparecem só em Todos e em ${exLabel()}.</p>`:""}
  <div class="bar"><button onclick="all_(1)">Marcar todos</button><button onclick="all_(0)">Limpar</button></div>
  <button class="btn ghost" style="margin:0 0 6px" onclick="askNew?novoDia():(askNew=true,render())">${askNew?"Toque de novo para limpar tudo":"Novo dia (limpar presenças, convidados e sorteio)"}</button>
  ${visP().length?visP().map(p=>`<label class="item"><span><b>${esc(p.name)}</b><small>${esc(p.pos)} · Nível ${p.lvl}${gl(p)}<span id="ar-${p.id}">${present.has(p.id)?" · chegada nº "+arr[p.id]:""}</span></small></span><input type="checkbox" ${present.has(p.id)?"checked":""} onchange="tg('${p.id}')"></label>`).join(""):`<p class="mut">${players.length?"Nenhum jogador neste filtro.":"Peça ao administrador para cadastrar jogadores."}</p>`}</section>
  <section class="card"><h2>Convidado de hoje</h2>
  <input id="gn" placeholder="Nome do convidado" maxlength="30">
  <div class="row"><select id="gp" onchange="togG('#gg',this.value)">${posOpts(defPos())}</select><select id="gl">${lvlOpts(3)}</select></div>
  ${groups().length?`<select id="gg" style="${exN(defPos())?"display:none":""}">${grpOpts("")}</select>`:""}
  <button class="btn ghost" style="margin-top:0" onclick="addG()">Adicionar convidado</button>
  ${guests.map((g,i)=>`<div class="item"><div><b>${esc(g.name)}</b><small>Convidado · ${esc(g.pos)} · Nível ${g.lvl}${gl(g)}</small></div><button class="ico" onclick="rmG(${i})" aria-label="Remover">✕</button></div>`).join("")}</section>
  <section class="card"><h2>Como dividir</h2>
  <label class="mut" for="ct">Número de times</label><input id="ct" type="number" inputmode="numeric" min="2" max="30" value="${qt.times}" oninput="qt.times=Math.max(2,+this.value||2)">
  <label class="mut" for="cj">Jogadores por time</label><input id="cj" type="number" inputmode="numeric" min="1" max="30" value="${qt.jog}" oninput="qt.jog=Math.max(1,+this.value||1)">
  <p class="mut" style="margin:0 0 8px;font-size:13px">Quem passar do total vai para as reservas, começando pelos grupos de menor prioridade e, dentro do grupo, por quem chegou por último. Posições com limite por time ficam garantidas.</p>
  <button class="btn" onclick="sortear()">Sortear times</button>
  ${err?`<p class="msg">${err}</p>`:""}</section>
  ${result?viewR():""}`+upd();
}
function rmG(i){const g=guests.splice(i,1)[0];if(g)delete arr[g.id];if(!present.size&&!guests.length){seqC=0;arr={}}render()}
function novoDia(){present=new Set();guests=[];arr={};seqC=0;result=null;sug=null;subOut=new Set();subIn="";note="";err="";askNew=false;render()}
function upd(){setTimeout(()=>{const c=$("#cnt");if(c)c.textContent="("+(present.size+guests.length)+" presentes)"},0);return""}
function tg(id){if(present.has(id)){present.delete(id);delete arr[id]}else{present.add(id);arr[id]=++seqC}if(!present.size&&!guests.length){seqC=0;arr={}}const s=$("#ar-"+id);if(s)s.textContent=present.has(id)?" · chegada nº "+arr[id]:"";upd()}
function all_(v){if(v){visP().forEach(p=>{if(!present.has(p.id)){present.add(p.id);arr[p.id]=++seqC}})}else{visP().forEach(p=>{present.delete(p.id);delete arr[p.id]})}if(!present.size&&!guests.length){seqC=0;arr={}}render()}
function addG(){
  const name=$("#gn").value.trim();
  if(!name){err="Digite o nome do convidado.";return render()}
  const pos=$("#gp").value,g={id:uid(),name,pos,lvl:+$("#gl").value,grp:(exN(pos)||!groups().length)?"":$("#gg").value,guest:1};
  guests.push(g);arr[g.id]=++seqC;err="";render();
}
function sortear(){
  const all=[...players.filter(p=>present.has(p.id)),...guests];
  if(all.length<2){err="Marque pelo menos 2 jogadores presentes.";result=null;return render()}
  const k=Math.max(2,Math.min(qt.times,all.length)),out=new Set();let fixed=0;
  cfg.pos.forEach(ps=>{if(ps.max>0){const g=all.filter(x=>x.pos===ps.n).sort(cmp);g.slice(k*ps.max).forEach(x=>out.add(x.id));fixed+=Math.min(g.length,k*ps.max)}});
  const slots=Math.max(0,k*qt.jog-fixed);
  all.filter(x=>!maxP(x.pos)).sort(cmp).slice(slots).forEach(x=>out.add(x.id));
  const list=all.filter(x=>!out.has(x.id)),n=list.length;err="";
  const cap=Math.ceil(n/k),order=[...new Set([...cfg.pos.map(p=>p.n),...list.map(x=>x.pos)])].sort((a,b)=>(maxP(a)>0?0:1)-(maxP(b)>0?0:1));
  let best=null,bs=1e9;
  for(let t=0;t<150;t++){
    const teams=Array.from({length:k},()=>({p:[],sum:0,pc:{}}));
    order.forEach(pos=>{
      list.filter(x=>x.pos===pos).map(x=>({x,r:Math.random()})).sort((a,b)=>b.x.lvl-a.x.lvl||a.r-b.r).forEach(({x})=>{
        let c=teams.filter(m=>m.p.length<cap&&(!maxP(pos)||(m.pc[pos]||0)<maxP(pos)));
        if(!c.length)c=teams.filter(m=>m.p.length<cap);
        const mp=Math.min(...c.map(m=>m.pc[pos]||0)),c2=c.filter(m=>(m.pc[pos]||0)==mp),ms=Math.min(...c2.map(m=>m.sum));
        const c3=c2.filter(m=>m.sum==ms),m=c3[Math.floor(Math.random()*c3.length)];
        m.p.push(x);m.sum+=x.lvl;m.pc[pos]=(m.pc[pos]||0)+1;
      });
    });
    const av=teams.map(m=>m.sum/(m.p.length||1));
    let sc=(Math.max(...av)-Math.min(...av))*10;
    order.forEach(pos=>{const v=teams.map(m=>m.pc[pos]||0);sc+=Math.max(...v)-Math.min(...v)});
    if(sc<bs){bs=sc;best=teams}
  }
  result=best;sug=null;subOut=new Set();subIn="";note="";render();
  setTimeout(()=>{const r=$("#res");if(r)r.scrollIntoView({behavior:"smooth"})},50);
}
const inTeams=()=>new Set(result.flatMap(m=>m.p.map(x=>x.id)));
const pool=()=>{const s=inTeams();return [...players,...guests].filter(x=>!s.has(x.id))};
const isRes=x=>x.guest||present.has(x.id);
const resList=()=>pool().filter(isRes);
const avg=m=>(m.sum/(m.p.length||1)).toFixed(1).replace(".",",");
const ord=m=>[...m.p].sort((a,b)=>ixP(a.pos)-ixP(b.pos)||b.lvl-a.lvl);
const resv=()=>{const r=resList();return r.length?`<div class="team"><header style="background:var(--bd);color:var(--tx)">Reservas<span>${r.length}</span></header>${r.map(p=>`<div class="pl"><span>${esc(p.name)}${p.guest?" (convidado)":""}</span><small>${esc(p.pos)} · N${p.lvl}</small></div>`).join("")}</div>`:""};
function viewR(){
  return `<div id="res"><h2>Times sorteados</h2>`+result.map((m,i)=>`<div class="team"><header style="background:${COLORS[i%COLORS.length]}">Time ${i+1}<span>${m.p.length} jogadores · nível médio ${avg(m)}</span></header>${ord(m).map(p=>`<div class="pl"><span>${esc(p.name)}${p.guest?" (convidado)":""}</span><small>${esc(p.pos)} · N${p.lvl}</small></div>`).join("")}</div>`).join("")+
  `${resv()}<button class="btn" onclick="sortear()">Sortear de novo</button><button class="btn ghost" onclick="copiar()">Copiar resultado</button><p class="mut" id="cp" style="text-align:center"></p></div>`;
}
function copiar(){
  const t=result.map((m,i)=>`Time ${i+1} (nível médio ${avg(m)})\n`+ord(m).map(p=>`- ${p.name} (${p.pos}, N${p.lvl})`).join("\n")).join("\n\n")+(resList().length?"\n\nReservas\n"+resList().map(p=>`- ${p.name} (${p.pos}, N${p.lvl})`).join("\n"):"");
  const ok=()=>{$("#cp").textContent="Resultado copiado."};
  const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){$("#cp").textContent="Não foi possível copiar."}a.remove()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
const byId=id=>[...players,...guests].find(x=>x.id===id);
const teamOf=id=>result.findIndex(m=>m.p.some(x=>x.id===id));
function selIn(v){subIn=v;sug=null;note="";err="";render()}
function tgo(id){subOut.has(id)?subOut.delete(id):subOut.add(id);sug=null;note="";err="";render()}
function viewT(){
  if(!result)return `<section class="card"><h2>Substituição</h2><p class="mut">Faça um sorteio na aba Sorteio para poder trocar jogadores.</p></section>`;
  const pl=pool().filter(isRes).sort((a,b)=>a.name.localeCompare(b.name));
  const opts=pl.map(x=>`<option value="${x.id}" ${x.id===subIn?"selected":""}>${esc(x.name)} (${esc(x.pos)}, N${x.lvl})</option>`).join("");
  return `<section class="card"><h2>Quem entra</h2>${pl.length?`<select onchange="selIn(this.value)"><option value="">Escolha um jogador de fora</option>${opts}</select>`:`<p class="mut">Não há jogadores de fora com presença confirmada. Marque quem chegou na aba Sorteio ou adicione um convidado.</p>`}</section>
  <section class="card"><h2>Quem pode sair</h2><p class="mut" style="margin:0 0 6px;font-size:13px">Marque os jogadores dos times que podem dar a vaga. Sai primeiro quem é do grupo de menor prioridade e, no mesmo grupo, quem chegou por último.</p>
  ${result.map((m,i)=>ord(m).map(p=>`<label class="item"><span><span class="chip" style="background:${COLORS[i%COLORS.length]}">Time ${i+1}</span><b>${esc(p.name)}</b><small>${esc(p.pos)} · Nível ${p.lvl}${gl(p)} · chegada nº ${arr[p.id]||"-"}</small></span><input type="checkbox" ${subOut.has(p.id)?"checked":""} onchange="tgo('${p.id}')"></label>`).join("")).join("")}
  <button class="btn" style="margin-top:10px" onclick="sugerir()">Sugerir quem sai</button>${err?`<p class="msg">${err}</p>`:""}${note?`<p class="ok">${esc(note)}</p>`:""}</section>${sug?viewSug():""}`;
}
function viewSug(){
  const {inc,out,rank,ti}=sug,m=result[ti],f=v=>v.toFixed(1).replace(".",",");
  const a0=m.sum/m.p.length,a1=(m.sum-out.lvl+inc.lvl)/m.p.length;
  return `<section class="card"><h2>Sugestão</h2><p><b>Sai:</b> <span class="chip" style="background:${COLORS[ti%COLORS.length]}">Time ${ti+1}</span>${esc(out.name)} (${esc(out.pos)}, N${out.lvl}${gl(out)})<br><b>Entra:</b> ${esc(inc.name)} (${esc(inc.pos)}, N${inc.lvl}${gl(inc)})</p><p class="mut">Nível médio do Time ${ti+1}: ${f(a0)} → ${f(a1)}${out.pos!==inc.pos?`. Atenção: a posição muda de ${esc(out.pos)} para ${esc(inc.pos)}.`:"."}</p>${pr(out)<pr(inc)?`<p class="msg">Atenção: ${esc(out.name)} tem prioridade sobre ${esc(inc.name)}.</p>`:""}${rank.length?`<p class="mut">Próximos na fila de saída: ${rank.map(r=>esc(r.x.name)).join(", ")}.</p>`:""}<button class="btn" onclick="confirmar()">Confirmar troca</button></section>`;
}
function sugerir(){
  note="";const inc=byId(subIn);
  if(!inc){err="Escolha quem entra.";sug=null;return render()}
  const outs=[...subOut].map(id=>({x:byId(id),ti:teamOf(id)})).filter(o=>o.x&&o.ti>=0);
  if(!outs.length){err="Marque pelo menos um jogador que pode sair.";sug=null;return render()}
  const cnt=(ti,n)=>result[ti].p.filter(p=>p.pos===n).length;
  const el=outs.filter(o=>o.x.pos===inc.pos||(!maxP(o.x.pos)&&(!maxP(inc.pos)||cnt(o.ti,inc.pos)<maxP(inc.pos))));
  if(!el.length){err="Esses jogadores não podem ser trocados por "+inc.name+" (posição com limite por time). Marque jogadores da mesma posição.";sug=null;return render()}
  el.sort((a,b)=>cmp(b.x,a.x));
  err="";sug={inc,out:el[0].x,ti:el[0].ti,rank:el.slice(1)};render();
}
function confirmar(){
  const {inc,out,ti}=sug,m=result[ti];
  m.p=m.p.map(x=>x.id===out.id?inc:x);m.sum=m.p.reduce((s,x)=>s+x.lvl,0);
  if(!inc.guest)present.add(inc.id);
  if(!arr[inc.id])arr[inc.id]=++seqC;
  note=inc.name+" entrou no Time "+(ti+1)+" no lugar de "+out.name+".";
  sug=null;subOut=new Set();subIn="";err="";render();
}
function viewA(){return viewA0()+secAcesso()}
function viewA0(){
  const st=FIREBASE_CONFIG?(isDono()?"Compartilhado · você é o criador do app":(OWNER?"Compartilhado · você é administrador desta pelada":"Somente leitura")):"Modo local · dados só neste aparelho";
  const d=OWNER?"":"disabled";
  return `<section class="card"><h2>Administração</h2><p class="mut">${st}</p>
  <label class="mut" for="tp">Tipo da pelada</label>
  <select id="tp" ${d} onchange="setTipo(this.value)">${Object.keys(TIPOS).map(k=>`<option value="${k}" ${k==cfg.tipo?"selected":""}>${TNOMES[k]}</option>`).join("")}</select>
  <label class="mut" for="md">Modelo de esporte</label>
  <select id="md" ${d}>${Object.keys(MODELOS).map(k=>`<option>${k}</option>`).join("")}</select>
  <button class="btn ghost" ${d} onclick="aplicarModelo()">Aplicar modelo de posições</button>
  ${err?`<p class="msg">${err}</p>`:""}</section>
  <section class="card"><h2>Posições</h2><p class="mut" style="margin:0 0 6px;font-size:13px">Nome, máximo por time (0 = sem limite) e se a posição fica fora da regra de idade.</p>
  ${cfg.pos.map((p,i)=>`<div class="item" style="flex-wrap:wrap"><input value="${esc(p.n)}" ${d} maxlength="20" onchange="renPos(${i},this.value)" style="flex:2;margin:0" aria-label="Nome da posição"><input type="number" min="0" max="9" value="${p.max}" ${d} onchange="setPos(${i},'max',Math.max(0,+this.value||0))" style="flex:1;margin:0" aria-label="Máximo por time"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" ${p.ex?"checked":""} ${d} onchange="setPos(${i},'ex',this.checked)">Sem idade</label><button class="ico" ${d} onclick="delPos(${i})" aria-label="Excluir posição">🗑</button></div>`).join("")}
  ${OWNER?`<input id="np" placeholder="Nova posição" maxlength="20" style="margin-top:10px"><button class="btn" onclick="addPos()">Adicionar posição</button>`:""}</section>`;
}
async function saveC(){if(!OWNER)return;err=err||"";await persist("c");render()}
function setTipo(v){cfg.tipo=v;err="";saveC()}
function aplicarModelo(){cfg.pos=mk(MODELOS[$("#md").value]);err="";saveC()}
function setPos(i,k,v){cfg.pos[i][k]=v;err="";saveC()}
async function renPos(i,v){
  v=v.trim();const old=cfg.pos[i].n;
  if(!v||(v!==old&&cfg.pos.some(p=>p.n===v))){err="Nome vazio ou já usado por outra posição.";return render()}
  cfg.pos[i].n=v;players.forEach(p=>{if(p.pos===old)p.pos=v});err="";await persist("p");saveC();
}
function delPos(i){
  if(players.some(p=>p.pos===cfg.pos[i].n)){err="Há jogadores nessa posição. Mude a posição deles antes de excluir.";return render()}
  if(cfg.pos.length<2){err="Mantenha pelo menos uma posição.";return render()}
  cfg.pos.splice(i,1);err="";saveC();
}
function addPos(){
  const v=$("#np").value.trim();
  if(!v||cfg.pos.some(p=>p.n===v)){err="Digite um nome novo para a posição.";return render()}
  cfg.pos.push({n:v,max:0,ex:false});err="";saveC();
}
